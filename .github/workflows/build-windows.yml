name: Build Windows installers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      app-version: ${{ steps.app-version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Read app version
        id: app-version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Release tag $env:RELEASE_TAG must match package version v$version."
          }
      - name: Build Windows NSIS and portable executables
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: PASS-Windows-${{ steps.app-version.outputs.version }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows executables
        uses: actions/download-artifact@v4
        with:
          name: PASS-Windows-${{ needs.build.outputs.app-version }}
          path: release
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: PASS ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.exe
          fail_on_unmatched_files: true

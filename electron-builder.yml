appId: org.pnhs.pass.attendance
productName: PASS Attendance
asar: true
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  artifactName: PASS-Setup-${version}.${ext}
portable:
  artifactName: PASS-Portable-${version}.${ext}

appId: org.pnhs.pass.attendance
productName: PASS Attendance
asar: true
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: PASS-${version}-${arch}-${target}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: PASS-${version}-${arch}-portable.${ext}
